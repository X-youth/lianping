</style><main><div class="top"><span>连平 LIANPING</span><span>风物观察 / 鹰嘴桃</span></div><div class="layout"><div><div class="intro"><h1>一颗桃，<br>慢慢长成。</h1><p>从枝头的一朵花，到夏日的一口清甜。<br>拖动下方进度，看见成长的变化。</p></div><div class="detail"><div class="phase" id="count">01 / 05</div><h2 id="title">含苞</h2><p id="desc">花苞藏在枝头，花瓣尚未舒展。</p></div></div><svg class="art" viewBox="0 0 800 680" role="img" aria-label="鹰嘴桃从花苞到成熟的生长示意"><defs><radialGradient id="fruit" cx="30%" cy="30%" r="80%"><stop stop-color="#dfe49b"/><stop offset=".55" stop-color="#b6ca71"/><stop offset="1" stop-color="#7b9c54"/></radialGradient><radialGradient id="blush"><stop stop-color="#c95558" stop-opacity=".8"/><stop offset="1" stop-color="#c95558" stop-opacity="0"/></radialGradient><radialGradient id="petal"><stop stop-color="#e89ba7"/><stop offset="1" stop-color="#f4ced0"/></radialGradient><clipPath id="fruitClip"><path id="clipShape"/></clipPath></defs><g id="branch"><path d="M775 180 C650 208 580 248 470 275 C365 300 275 330 180 390" fill="none" stroke="#685244" stroke-width="17" stroke-linecap="round"/><path d="M770 176 C640 208 530 263 458 272" fill="none" stroke="#a68c68" stroke-width="4"/><path d="M460 278 Q440 320 430 340" fill="none" stroke="#6a6950" stroke-width="9" stroke-linecap="round"/><path d="M552 248 Q557 208 542 170 M325 321 Q301 278 267 265" fill="none" stroke="#685244" stroke-width="6" stroke-linecap="round"/></g><g id="leaves"><path d="M540 190 Q558 106 664 91 Q645 163 540 190Z" fill="#4d7146"/><path d="M540 190 L648 105" stroke="#8eaa6d" fill="none" stroke-width="2"/><path d="M333 322 Q255 225 196 251 Q234 325 333 322Z" fill="#6e8e4c"/><path d="M333 322 L214 258" stroke="#a3b67c" fill="none" stroke-width="2"/></g><g id="fruitGroup"><path id="fruitShape" fill="url(#fruit)" stroke="#809957" stroke-width="1"/><g clip-path="url(#fruitClip)"><ellipse id="cheek" cx="470" cy="445" rx="100" ry="135" fill="url(#blush)"/><g id="specks"></g></g><path id="seam" d="M429 353 Q405 450 435 535" fill="none" stroke="#6f9155" stroke-opacity=".35" stroke-width="2"/></g><g id="flower" transform="translate(430 345)"><g id="petals"></g><circle r="12" fill="#ce6a7e"/><g id="stamens"></g></g><g id="bud" transform="translate(430 345)"><path d="M0 22 C-48 -12 -31 -57 0 -69 C31 -48 43 -5 0 22Z" fill="#bb6078"/><path d="M0 19 Q-17 -24 0 -67 Q16 -18 0 19" fill="#e09aab"/><path d="M-22 8 L0 26 L22 8 L10 35 L-9 35Z" fill="#6b8551"/></g><text x="610" y="627" class="seed">生长过程示意 / 非实拍</text></svg></div><div class="bottom"><div id="stages"></div><button id="play">自动生长 ▶</button><div class="track"><input id="progress" aria-label="生长进度" type="range" min="0" max="1000" value="0"></div></div><small>基于鹰嘴桃外形特征的视觉原型；阶段过渡为艺术化示意，未对应具体生长天数。</small></main><script>
const $=s=>document.querySelector(s),ns='http://www.w3.org/2000/svg';const names=['含苞','花开','坐果','长大','成熟'];const descriptions=['花苞藏在枝头，花瓣尚未舒展。','花瓣向外展开，露出细细的花蕊。','花谢之后，小小的青果留在枝头。','青果渐渐饱满，叶片也舒展开来。','青绿果皮泛起红晕，果尖露出鹰嘴般的突起。'];let target=0,current=0,playing=false,last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(let i=0;i<5;i++){const g=document.createElementNS(ns,'g');g.setAttribute('transform',`rotate(${i*72})`);const p=document.createElementNS(ns,'path');p.setAttribute('d','M0 4 C-58 -15 -67 -72 -27 -85 C-10 -91 1 -77 0 -68 C21 -98 58 -83 53 -48 C49 -20 24 -3 0 4Z');p.setAttribute('fill','url(#petal)');p.setAttribute('stroke','#d993a1');p.setAttribute('stroke-width','.7');g.append(p);$('#petals').append(g);}
for(let i=0;i<20;i++){const a=i*2.39996,r=18+(i%4)*4;const line=document.createElementNS(ns,'path');line.setAttribute('d',`M0 0 L${Math.cos(a)*r} ${Math.sin(a)*r}`);line.setAttribute('stroke','#f2d18e');line.setAttribute('stroke-width','1');const c=document.createElementNS(ns,'circle');c.setAttribute('cx',Math.cos(a)*r);c.setAttribute('cy',Math.sin(a)*r);c.setAttribute('r','2');c.setAttribute('fill','#c9a04d');$('#stamens').append(line,c);}
for(let i=0;i<300;i++){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',310+((i*73)%230));c.setAttribute('cy',330+((i*97)%250));c.setAttribute('r',i%3===0?'.9':'.5');c.setAttribute('fill',i%2?'#f2e4ba':'#617e43');c.setAttribute('opacity','.25');$('#specks').append(c);}
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{playing=false;target=i/4;syncPlay();};$('#stages').append(b);});$('#progress').oninput=e=>{playing=false;target=e.target.value/1000;syncPlay();};function syncPlay(){$('#play').textContent=playing?'暂停生长 Ⅱ':'自动生长 ▶';}$('#play').onclick=()=>{playing=!playing;if(playing&&target>.99){target=0;current=0;}syncPlay();};
const clamp=(v)=>Math.max(0,Math.min(1,v)),smooth=(a,b,v)=>{let t=clamp((v-a)/(b-a));return t*t*(3-2*t);};function draw(v){const bloom=smooth(.03,.25,v),fade=smooth(.28,.46,v),growth=smooth(.39,1,v),size=.12+.88*growth,mature=smooth(.73,1,v);$('#bud').style.opacity=1-smooth(.02,.16,v);$('#bud').setAttribute('transform',`translate(430 345) scale(${1-bloom*.3})`);$('#flower').style.opacity=smooth(.04,.13,v)*(1-fade);$('#flower').setAttribute('transform',`translate(430 ${345+fade*22}) rotate(${fade*12}) scale(${.25+.75*bloom})`);$('#fruitGroup').style.opacity=smooth(.32,.42,v);$('#fruitGroup').setAttribute('transform',`translate(430 345) scale(${size}) translate(-430 -345)`);const d=`M430 345 C395 316 324 345 318 417 C311 478 358 530 412 544 Q${441+mature*11} ${553+mature*26} ${451+mature*4} ${539+mature*3} C529 516 557 444 532 392 C513 351 467 324 430 345Z`;$('#fruitShape').setAttribute('d',d);$('#clipShape').setAttribute('d',d);$('#cheek').style.opacity=mature;$('#seam').style.opacity=.25+mature*.6;$('#leaves').setAttribute('transform',`translate(450 250) scale(${.6+.4*smooth(.2,.8,v)}) translate(-450 -250)`);const idx=Math.min(4,Math.floor(v*4+.4));$('#count').textContent=`0${idx+1} / 05`;$('#title').textContent=names[idx];$('#desc').textContent=descriptions[idx];document.querySelectorAll('#stages button').forEach((b,i)=>{b.classList.toggle('active',i===idx);b.setAttribute('aria-pressed',i===idx);});$('#progress').value=Math.round(v*1000);}
function tick(t){const dt=Math.min((t-last)/1000,.05);last=t;if(playing){target=Math.min(1,target+dt/16);if(target>=1){playing=false;syncPlay();}}current=reduced?target:current+(target-current)*(1-Math.exp(-dt*9));draw(current);requestAnimationFrame(tick);}draw(0);requestAnimationFrame(tick);
</script></html>
